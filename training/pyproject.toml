[project]
name = "seeni"
version = "0.1.0"
description = "Data download, training, evaluation and ONNX export for seeni"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv]
# The desktop runs Linux (WSL2) and development happens on a Mac.
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.ruff]
line-length = 100
target-version = "py312"
