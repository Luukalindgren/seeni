name: Pages

# Builds the web app and publishes it to https://luukalindgren.github.io/seeni/ on every
# push to main (PLAN.md phase 10). The tests (unit, parity, offline) run in ci.yml on the PR
# and on main; this only builds and deploys.
#
# Deploying is on: the owner set the repository's Pages source to "GitHub Actions" and the
# repository variable DEPLOY_PAGES to true (2026-10-21). Setting DEPLOY_PAGES to anything
# else stops the deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
