[project]
name = "seeni"
version = "0.1.0"
description = "Data download, training, evaluation and ONNX export for seeni"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "onnx>=1.23.2",
    "onnxconverter-common>=1.16.0",
    "onnxruntime>=1.31.0",
    "onnxscript>=0.7.2",
    "pillow>=13.0.0",
    "pyarrow>=26.0.0",
    "tensorboard>=2.21.0",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv]
# The desktop runs Linux (WSL2) and development happens on an Apple Silicon Mac.
# PyTorch has no wheels for Intel Macs.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ruff]
line-length = 100
